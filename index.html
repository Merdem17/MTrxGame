<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>MTrxGame - Lider Tablosu Demo</title>
<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  overflow: hidden;
}
#game-container {
  display: flex;
  flex-direction: column;
  align-items: center;
}
canvas {
  background: black;
  border: 4px solid #555;
}
/* Lider Tablosu stili */
#leaderboard-container {
  margin-left: 20px;
  padding: 10px;
  background: #111;
  border: 2px solid #555;
  border-radius: 10px;
  width: 200px;
  height: 640px;
  overflow-y: auto;
}
#leaderboard-container h2 {
  text-align: center;
  margin-top: 0;
  font-size: 18px;
  color: #0f0;
}
#leaderboard {
  list-style: none;
  padding: 0;
  margin: 0;
}
#leaderboard li {
  margin: 5px 0;
  font-size: 14px;
}
#puanDisplay {
  margin-bottom: 10px;
  font-size: 20px;
  text-align: center;
}

/* Responsive: mobilde tablo altta */
@media(max-width: 700px){
  body { flex-direction: column; align-items: center; }
  #leaderboard-container { margin-left: 0; margin-top: 20px; width: 90%; height: auto; }
}
</style>
</head>
<body>

<div id="game-container">
  <div id="puanDisplay">Puan: <span id="puan">0</span></div>
  <canvas id="gameCanvas"></canvas>
</div>

<!-- Lider Tablosu -->
<div id="leaderboard-container">
  <h2>Lider Tablosu</h2>
  <ul id="leaderboard"></ul>
</div>

<script>
// ------------------- Mevcut Oyun Kodu -------------------
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth > 600 ? 480 : window.innerWidth*0.9;
canvas.height = window.innerHeight > 600 ? 640 : window.innerHeight*0.7;

window.addEventListener("resize", ()=>{
  canvas.width = window.innerWidth > 600 ? 480 : window.innerWidth*0.9;
  canvas.height = window.innerHeight > 600 ? 640 : window.innerHeight*0.7;
});

let puan = 0;
let rocks = [];
let lastSpawn = 0;
let globalRockSpeed = 2;
let spawnInterval = 1500;

const puanEl = document.getElementById("puan");

// Taş görselleri
const images = {
  stone: new Image(),
  silver: new Image(),
  gold: new Image(),
  red: new Image()
};
images.stone.src = "stone.png";
images.silver.src = "silver.png";
images.gold.src = "gold.png";
images.red.src = "red.png";

// Taş sınıfı
class Rock {
  constructor(type){
    this.type = type;
    this.size = window.innerWidth>600?60:40;
    this.x = Math.random()*(canvas.width-this.size);
    this.y = -this.size;
  }
  update(){ this.y += globalRockSpeed; }
  draw(){ ctx.drawImage(images[this.type],this.x,this.y,this.size,this.size); }
}

// Taş spawn fonksiyonları
function spawnRock(){ rocks.push(new Rock("stone")); }
function spawnSilver(){ rocks.push(new Rock("silver")); }
function spawnGold(){ rocks.push(new Rock("gold")); }
function spawnRed(){ rocks.push(new Rock("red")); }

// Kırmızı taş olasılığı puana göre artacak
function getRedChance(puan){
  return Math.min(0.1 + puan/10000, 0.6);
}

// Canvas click event
canvas.addEventListener("click",(e)=>{
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  rocks.forEach((rock,i)=>{
    if(mx > rock.x && mx < rock.x+rock.size && my > rock.y && my < rock.y+rock.size){
      if(rock.type==="stone") puan += 1;
      if(rock.type==="silver") puan += 10;
      if(rock.type==="gold") puan += 100;
      if(rock.type==="red") puan = Math.floor(puan*0.5);
      rocks.splice(i,1);
      updateLeaderboard(puan); // Skor değişince tabloyu güncelle
    }
  });
});

function update(){
  let now = Date.now();
  if(now - lastSpawn > spawnInterval){
    if(Math.random() < getRedChance(puan)) spawnRed();
    else {
      const r = Math.random();
      if(r<0.7) spawnRock();
      else if(r<0.95) spawnSilver();
      else spawnGold();
    }
    lastSpawn = now;
  }

  // Oyun hızı puana göre artıyor
  globalRockSpeed = Math.min(2 + puan/1000, 5);
  spawnInterval = Math.max(700, 1500 - puan*0.5);

  rocks.forEach(r=>r.update());
  rocks = rocks.filter(r=>r.y < canvas.height);

  puanEl.textContent = puan;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  rocks.forEach(r=>r.draw());
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// Oyun başlat
loop();

// ------------------- Lider Tablosu Kodu -------------------
const leaderboardEl = document.getElementById("leaderboard");

// Mock veri (TRX adresleri ve skor)
let leaderboardData = [
  { address: "TAAA111...", score: 3200 },
  { address: "TBBB222...", score: 2800 },
  { address: "TCCC333...", score: 2500 },
  { address: "TDDD444...", score: 2000 },
  { address: "TEEE555...", score: 1800 },
  { address: "TFFF666...", score: 1500 },
  { address: "TGGG777...", score: 1200 },
  { address: "THHH888...", score: 1000 },
  { address: "TIII999...", score: 800 },
  { address: "TJJJ000...", score: 500 }
];

// Oyuncu TRX adresi (mock, gerçek entegrasyonda URL parametresinden alınacak)
let playerAddress = "TMERTERDEM...";

// Skoru tabloya ekle ve güncelle
function updateLeaderboard(currentScore){
  // Eğer oyuncu tabloda yoksa ekle
  let existing = leaderboardData.find(p => p.address === playerAddress);
  if(existing){
    existing.score = Math.max(existing.score, currentScore);
  } else {
    leaderboardData.push({ address: playerAddress, score: currentScore });
  }

  // Skoru yüksekten düşüğe sırala
  leaderboardData.sort((a,b)=>b.score - a.score);

  // İlk 10 kişiyi al
  let top10 = leaderboardData.slice(0,10);

  // Listeyi temizle
  leaderboardEl.innerHTML = "";

  // Top10’u ekle
  top10.forEach((p,i)=>{
    leaderboardEl.innerHTML += `<li>${i+1}. ${p.address} - ${p.score}</li>`;
  });

  // Eğer oyuncu top10’da değilse en alta kendi sırasını ekle
  let playerIndex = leaderboardData.findIndex(p=>p.address===playerAddress);
  if(playerIndex >= 10){
    leaderboardEl.innerHTML += `<li>Sen: ${playerAddress} - ${currentScore} (#${playerIndex+1})</li>`;
  }
}

// İlk tabloyu başta güncelle
updateLeaderboard(puan);

</script>

</body>
</html>
