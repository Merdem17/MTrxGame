<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>MTrxGame - TRX Giriş</title>
<style>
body {
  margin: 0;
  background: black;
  font-family: sans-serif;
  overflow-x: hidden;
  color: white;
}

/* Wrapper: oyun alanı ve tablo yan yana */
#game-wrapper {
  display: flex;
  flex-direction: row;
  justify-content: center;
  position: relative;
  margin-top: 50px;
}

/* Oyun alanı */
#game-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

/* Başlık */
#game-title {
  font-size: 32px;
  color: #0f0;
  margin-bottom: 10px;
  text-align: center;
  text-shadow: 2px 2px 4px #000;
}

/* Puan display */
#puanDisplay {
  margin-bottom: 10px;
  font-size: 20px;
  text-align: center;
  display: none; /* Başlangıçta gizli */
}

/* Canvas */
canvas {
  background: black;
  border: 4px solid #555;
  display: none; /* Başlangıçta gizli */
}

/* Lider tablosu */
#leaderboard-container {
  width: 200px;
  background: #111;
  border: 2px solid #555;
  border-radius: 10px;
  overflow-y: auto;
  padding: 10px;
  position: absolute;
  top: calc(50px + 32px + 10px + 20px);
  left: 1600px; /* Sağ tarafa kaydırıldı */
  display: flex;
  flex-direction: column;
  display: none; /* Başlangıçta gizli */
}

#leaderboard-container h2 {
  text-align: center;
  margin-top: 0;
  font-size: 18px;
  color: #0f0;
}

#leaderboard {
  list-style: none;
  padding: 0;
  margin: 0;
}

#leaderboard li {
  margin: 5px 0;
  font-size: 14px;
}

/* TRX giriş ekranı */
#trx-entry {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 200px;
}

#trx-entry input {
  padding: 10px;
  font-size: 16px;
  width: 250px;
  margin-bottom: 10px;
}

#trx-entry button {
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
}

/* Mobil uyum */
@media(max-width: 1400px){
  #leaderboard-container {
    left: auto;
    margin-left: 20px;
    top: auto;
    position: static;
  }
}
</style>
</head>
<body>

<!-- TRX giriş ekranı -->
<div id="trx-entry">
  <h1>MTrxGame</h1>
  <p>Lütfen TRX adresinizi girin:</p>
  <input type="text" id="trx-address" placeholder="TRX adresiniz">
  <button id="start-game">Başla</button>
</div>

<div id="game-wrapper" style="display:none;">
  <div id="game-area">
    <h1 id="game-title">MTrxGame</h1>
    <div id="puanDisplay">Puan: <span id="puan">0</span></div>
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="leaderboard-container">
    <h2>Lider Tablosu</h2>
    <ul id="leaderboard"></ul>
  </div>
</div>

<script>
// -------------------- Başlangıç --------------------
let playerAddress = "";

const startBtn = document.getElementById("start-game");
const trxInput = document.getElementById("trx-address");
const trxEntry = document.getElementById("trx-entry");
const gameWrapper = document.getElementById("game-wrapper");

startBtn.addEventListener("click", ()=>{
  const addr = trxInput.value.trim();
  if(addr === ""){
    alert("Lütfen TRX adresinizi girin!");
    return;
  }
  playerAddress = addr;

  // Giriş ekranını gizle, oyunu göster
  trxEntry.style.display = "none";
  gameWrapper.style.display = "flex";

  // Puan display, canvas ve leaderboard görünür
  document.getElementById("puanDisplay").style.display = "block";
  document.getElementById("gameCanvas").style.display = "block";
  document.getElementById("leaderboard-container").style.display = "flex";

  // Oyun döngüsünü başlat
  loop();
  updateLeaderboard(0);
});

// -------------------- Oyun Kodu --------------------
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth > 600 ? 480 : window.innerWidth*0.9;
canvas.height = window.innerHeight > 600 ? 640 : window.innerHeight*0.7;

window.addEventListener("resize", ()=>{
  canvas.width = window.innerWidth > 600 ? 480 : window.innerWidth*0.9;
  canvas.height = window.innerHeight > 600 ? 640 : window.innerHeight*0.7;
});

let puan = 0;
let rocks = [];
let lastSpawn = 0;
let globalRockSpeed = 2;
let spawnInterval = 1500;

let silverCount = 0;
let goldCount = 0;

const puanEl = document.getElementById("puan");

// Taş görselleri
const images = {
  stone: new Image(),
  silver: new Image(),
  gold: new Image(),
  red: new Image()
};
images.stone.src = "stone.png";
images.silver.src = "silver.png";
images.gold.src = "gold.png";
images.red.src = "red.png";

// Taş sınıfı
class Rock {
  constructor(type){
    this.type = type;
    this.size = window.innerWidth>600?60:40;
    this.x = Math.random()*(canvas.width-this.size);
    this.y = -this.size;
  }
  update(){ this.y += globalRockSpeed; }
  draw(){ ctx.drawImage(images[this.type],this.x,this.y,this.size,this.size); }
}

// Taş spawn fonksiyonları
function spawnRock(){ rocks.push(new Rock("stone")); }
function spawnSilver(){ rocks.push(new Rock("silver")); }
function spawnGold(){ rocks.push(new Rock("gold")); }
function spawnRed(){ rocks.push(new Rock("red")); }

// Kırmızı taş olasılığı puana göre artıyor
function getRedChance(puan){
  return Math.min(0.1 + puan/1000 * 0.05, 0.6);
}

// Canvas click event
canvas.addEventListener("click",(e)=>{
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  rocks.forEach((rock,i)=>{
    if(mx > rock.x && mx < rock.x+rock.size && my > rock.y && my < rock.y+rock.size){
      if(rock.type==="stone") puan += 1;
      if(rock.type==="silver") puan += 10;
      if(rock.type==="gold") puan += 50;
      if(rock.type==="red") puan = Math.max(0, Math.floor(puan*0.5));
      rocks.splice(i,1);
      updateLeaderboard(puan);
    }
  });
});

// Taş düşüş mantığı
function spawnRocksByScore(){
  spawnRock();

  if(puan > 0 && puan % 25 === 0){
    spawnSilver();
    silverCount++;
  }

  if(silverCount >= 25){
    spawnGold();
    silverCount = 0;
    goldCount++;
  }

  if(Math.random() < getRedChance(puan)) spawnRed();
}

function update(){
  let now = Date.now();
  if(now - lastSpawn > spawnInterval){
    spawnRocksByScore();
    lastSpawn = now;
  }

  globalRockSpeed = Math.min(2 + puan/500, 7);
  spawnInterval = Math.max(400, 1500 - puan*0.5);

  rocks.forEach(r=>r.update());
  rocks = rocks.filter(r=>r.y < canvas.height);

  puanEl.textContent = puan;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  rocks.forEach(r=>r.draw());
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

// Lider tablosu
const leaderboardEl = document.getElementById("leaderboard");

let leaderboardData = [
  { address: "TAAA111...", score: 0 },
  { address: "TBBB222...", score: 0 },
  { address: "TCCC333...", score: 0 },
  { address: "TDDD444...", score: 0 },
  { address: "TEEE555...", score: 0 },
  { address: "TFFF666...", score: 0 },
  { address: "TGGG777...", score: 0 },
  { address: "THHH888...", score: 0 },
  { address: "TIII999...", score: 0 },
  { address: "TJJJ000...", score: 0 }
];

function updateLeaderboard(currentScore){
  let existing = leaderboardData.find(p => p.address === playerAddress);
  if(existing){
    existing.score = Math.max(existing.score, currentScore);
  } else {
    leaderboardData.push({ address: playerAddress, score: currentScore });
  }

  leaderboardData.sort((a,b)=>b.score - a.score);
  let top10 = leaderboardData.slice(0,10);

  leaderboardEl.innerHTML = "";
  top10.forEach((p,i)=>{
    leaderboardEl.innerHTML += `<li>${i+1}. ${p.address} - ${p.score}</li>`;
  });

  let playerIndex = leaderboardData.findIndex(p=>p.address===playerAddress);
  if(playerIndex >= 10){
    leaderboardEl.innerHTML += `<li>Sen: ${playerAddress} - ${currentScore} (#${playerIndex+1})</li>`;
  }
}
</script>

</body>
</html>
